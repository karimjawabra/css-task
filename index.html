<!DOCTYPE html>
<html>

  <style>
    body{
      margin: 0;
    
    }
    nav {
      background: rgb(0, 32, 81);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      width: 50px;
      height: 50px;
    }
  
    ul {
      display: flex;
      gap: 20px;
      margin: 5px;
    }

    a {
      color: white;
    }
    h1 {
      text-align: center;
    }
    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .rest {
      background: white;
      padding: 15px;
    }

    .rest img {
      max-width: 100%;
    }

    .first {
      grid-column: span 2;
      background: white;
      padding: 15px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .photos {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      nav {
        flex-direction: column;
        gap: 10px;
      }

      ul {
        flex-direction: column;
        text-align: center;
      }

      .photos {
        grid-template-columns: 1fr;

      }

      .first {
        grid-column: span 1;
      }

      .rest img {
        max-width: 100%;
      }
       

    }
  </style>

<body>

  <nav>
    <div class="logo">
              <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0=" >
    </div>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    

    <div class="photos">

      <div class="first">
        <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0=" >
      </div>

      <div class="rest">
        <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0=" >
      </div>

      <div class="rest">
        <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0=" >
      </div>

      <div class="rest">
        <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0=" >
      </div>

      <div class="rest">
        <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0=" >
      </div>

      <div class="rest">
        <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0=" >

    </div>
  </div>

</body>
</html>
